[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "live-edit"
version = "0.2.2"
description = "Natural-language-driven live code editing for any web application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
    "tomli>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "sqlite-vec>=0.1.0",
]
rag = ["sentence-transformers>=3.0", "sqlite-vec>=0.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[project.scripts]
live-edit = "live_edit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["live_edit"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["__pycache__", ".git", ".venv", "dist", "build", ".pytest_cache", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["live_edit"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["live_edit"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_no_return = true
show_error_codes = true
